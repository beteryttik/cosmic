name: Build Cosmic Mod

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find and unzip project archive
        run: |
          ZIP_FILE=$(find . -maxdepth 1 -name "*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "Ошибка: zip-архив проекта не найден в корне репозитория!"
            exit 1
          fi

          echo "Найден архив: $ZIP_FILE — распаковываю в корень проекта..."
          unzip -o "$ZIP_FILE"

          if [ ! -f "./build.gradle" ]; then
            for dir in */; do
              if [ -f "./${dir}build.gradle" ]; then
                echo "Проект вложен в каталог ${dir} — перемещаю на уровень выше..."
                mv "${dir}"* .
                rmdir "${dir}"
                break
              fi
            done
          fi

          if [ ! -f "./build.gradle" ]; then
            echo "Ошибка: после распаковки не найден build.gradle!"
            exit 1
          fi

          echo "Проект распакован. Содержимое корня:"
          ls -la

      - name: Overwrite gradle.properties with fixed version
        run: |
          cat > gradle.properties << 'EOF'
          org.gradle.jvmargs=-Xmx3G
          org.gradle.daemon=false

          minecraft_version=1.20.1
          forge_version=47.3.0
          mapping_channel=official
          mapping_version=1.20.1

          mod_id=cosmic
          mod_name=Cosmic
          mod_version=0.1.0
          mod_group_id=com.klyzz.cosmic
          mod_authors=klyzz
          mod_description=Industrial hardcore space simulator mod.

          geckolib_version=4.4.4
          flywheel_version=0.6.11-12
          jei_version=15.2.0.27
          create_curse_file_id=5688638
          curios_curse_file_id=4985525
          EOF
          echo "gradle.properties перезаписан."
          cat gradle.properties

      - name: Overwrite build.gradle with fixed repos & deps
        run: |
          cat > build.gradle << 'EOF'
          plugins {
              id 'eclipse'
              id 'idea'
              id 'net.minecraftforge.gradle' version '[6.0,6.2)'
          }

          version = "${mod_version}"
          group = "${mod_group_id}"

          java.toolchain.languageVersion = JavaLanguageVersion.of(17)

          println('Java: ' + System.getProperty('java.version'))
          println('Gradle: ' + gradle.gradleVersion)
          println('Forge: ' + forge_version)

          minecraft {
              mappings channel: "${mapping_channel}", version: "${mapping_version}"

              runs {
                  client {
                      workingDirectory project.file('run')
                      property 'forge.logging.console.level', 'info'
                      mods {
                          cosmic {
                              source sourceSets.main
                          }
                      }
                  }
                  server {
                      workingDirectory project.file('run')
                      property 'forge.logging.console.level', 'info'
                      mods {
                          cosmic {
                              source sourceSets.main
                          }
                      }
                  }
              }
          }

          repositories {
              maven {
                  name = 'ModMaven'
                  url = 'https://modmaven.dev/'
                  content { includeGroup 'com.simibubi.create'; includeGroup 'com.jozufozu.flywheel' }
              }
              maven {
                  name = 'BlameJared'
                  url = 'https://maven.blamejared.com/'
              }
              maven {
                  name = 'CurseMaven'
                  url = 'https://cursemaven.com'
                  content { includeGroup 'curse.maven' }
              }
              maven {
                  name = 'GeckoLib'
                  url = 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/'
                  content { includeGroupByRegex 'software\\.bernie.*'; includeGroup 'com.eliotlash.mclib' }
              }
          }

          dependencies {
              minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"

              implementation fg.deobf("software.bernie.geckolib:geckolib-forge-${minecraft_version}:${geckolib_version}")
              implementation fg.deobf("com.eliotlash.mclib:mclib:20")

              implementation fg.deobf("com.jozufozu.flywheel:flywheel-forge-${minecraft_version}:${flywheel_version}")

              implementation fg.deobf("curse.maven:create-328085:${create_curse_file_id}")
              implementation fg.deobf("curse.maven:curios-309927:${curios_curse_file_id}")

              implementation fg.deobf("mezz.jei:jei-${minecraft_version}-common-api:${jei_version}")
              implementation fg.deobf("mezz.jei:jei-${minecraft_version}-forge:${jei_version}")
          }

          tasks.withType(JavaCompile).configureEach {
              it.options.encoding = 'UTF-8'
              it.options.release = 17
          }

          jar {
              manifest {
                  attributes([
                      "Specification-Title": "${mod_name}",
                      "Specification-Vendor": "${mod_authors}",
                      "Specification-Version": "${mod_version}",
                      "Implementation-Title": "cosmic",
                      "Implementation-Version": "${mod_version}",
                      "Implementation-Vendor": "${mod_authors}"
                  ])
              }
          }
          EOF
          echo "build.gradle перезаписан."
          grep -A 12 '^dependencies' build.gradle

      - name: Set up JDK 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('*.gradle', 'gradle.properties') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: Generate Gradle wrapper if missing
        run: |
          if [ ! -f "gradle/wrapper/gradle-wrapper.jar" ]; then
            echo "Wrapper не найден — устанавливаю Gradle 8.4 и генерирую..."
            sudo apt-get update -y
            sudo apt-get install -y unzip wget
            wget https://services.gradle.org/distributions/gradle-8.4-bin.zip -O /tmp/gradle.zip
            unzip -q /tmp/gradle.zip -d /opt
            /opt/gradle-8.4/bin/gradle wrapper --gradle-version 8.4
          fi

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew build --no-daemon --stacktrace

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: cosmic-mod-build
          path: build/libs/cosmic-*.jar
          if-no-files-found: error
