name: Build Cosmic Mod

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find and unzip project archive
        run: |
          ZIP_FILE=$(find . -maxdepth 1 -name "*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "Ошибка: zip-архив проекта не найден в корне репозитория!"
            exit 1
          fi

          echo "Найден архив: $ZIP_FILE — распаковываю в корень проекта..."
          unzip -o "$ZIP_FILE"

      - name: Overwrite gradle.properties
        run: |
          cat > gradle.properties << 'EOF'
          org.gradle.jvmargs=-Xmx3G
          org.gradle.daemon=false

          minecraft_version=1.20.1
          forge_version=47.4.28
          mapping_channel=official
          mapping_version=1.20.1

          mod_id=cosmic
          mod_name=Cosmic
          mod_version=0.1.0
          mod_group_id=com.klyzz.cosmic
          mod_authors=klyzz
          mod_description=Industrial hardcore space simulator mod.

          geckolib_version=4.4.4
          flywheel_version=0.6.11-12
          jei_version=15.2.0.27
          create_curse_file_id=5688638
          curios_curse_file_id=4985525
          EOF
          echo "gradle.properties перезаписан."
          cat gradle.properties

      - name: Set up JDK 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('*.gradle', 'gradle.properties') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: Generate Gradle wrapper if missing
        run: |
          if [ ! -f "gradle/wrapper/gradle-wrapper.jar" ]; then
            echo "Wrapper не найден — устанавливаю Gradle 8.4 и генерирую..."
            sudo apt-get update -y
            sudo apt-get install -y unzip wget
            wget https://services.gradle.org/distributions/gradle-8.4-bin.zip -O /tmp/gradle.zip
            unzip -q /tmp/gradle.zip -d /opt
            /opt/gradle-8.4/bin/gradle wrapper --gradle-version 8.4
          fi

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew build --no-daemon

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: cosmic-mod-build
          path: build/libs/cosmic-*.jar
          if-no-files-found: error
